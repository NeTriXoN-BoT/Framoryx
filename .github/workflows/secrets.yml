name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch checksum-pinned scanner
        shell: python
        run: |
          import hashlib, io, pathlib, tarfile, urllib.request
          url = 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(32 * 1024 * 1024 + 1)
          assert len(data) <= 32 * 1024 * 1024
          assert hashlib.sha256(data).hexdigest() == '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              executable = archive.extractfile('gitleaks').read()
          path = pathlib.Path('/tmp/framoryx-gitleaks')
          path.write_bytes(executable)
          path.chmod(0o700)
      - name: Scan complete Git history
        run: /tmp/framoryx-gitleaks git . --redact --no-banner
