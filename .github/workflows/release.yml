name: Prepare verified draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching VERSION
        required: true
        default: v0.3.0
      desktop_run:
        description: Successful shared desktop workflow run for the current main commit
        required: true
permissions:
  contents: write
  actions: read
  security-events: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Promote verified Windows and Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DESKTOP_RUN: ${{ inputs.desktop_run }}
        run: python3 scripts/prepare-release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --run "$DESKTOP_RUN"
