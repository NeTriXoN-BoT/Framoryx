name: Build and core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable-core:
    name: Portable core / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/core --parallel
      - run: ctest --test-dir build/core --output-on-failure
  windows:
    name: Windows native build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/build/toolchain
            tools/PresentMon.exe
            tools/PresentMon-2.6.0-x64.exe
          key: llvm-mingw-20261104-ucrt-windows-x64
      - name: Fetch verified toolchain and monitor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-ci-tools.ps1
      - name: Build Windows engine and diagnostic harness
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Check legacy engine harness layout regressions
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'framoryx-layout-checks'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($page in 0..6) {
            $settings=Join-Path $root ("page-$page.ini")
            $report=Join-Path $root ("page-$page.json")
            [IO.File]::WriteAllText($settings,"motion=0`ndesktop_scale=100`nauto_noise_updates=0`n")
            $arguments=@('--smoke-seconds','14','--smoke-layout','--smoke-page',$page,'--audio-mic','--settings-file',('"'+$settings+'"'),'--report',('"'+$report+'"'))
            $process=Start-Process -FilePath './dist/Framoryx/Framoryx.exe' -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if(!$process.WaitForExit(30000)){Stop-Process -Id $process.Id -Force;throw "Layout diagnostic timed out on page $page"}
            if($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)){throw "Layout diagnostic failed on page $page"}
            $result=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if($result.layoutChecks -ne 5){throw "Incomplete layout checks on page $page"}
            Write-Output "Page $page passed all five maximize/percentage/restore checks."
          }
      - name: Check graphics and capture on the isolated runner
        timeout-minutes: 12
        shell: pwsh
        run: |
          $toolchain=(Resolve-Path './work/build/toolchain/llvm-mingw-20261104-ucrt-x86_64/bin').Path
          ./dist/Framoryx/source/validate.ps1 -ToolchainBin $toolchain -BuildDirectory ./work/graphics-validation -IncludeGraphicsTests -SoakSeconds 180 -IncludeAudioNetworkTests
      - name: Check complete feature flows and capture native UI previews
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/check-features.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Framoryx-Feature-Reports
          path: |
            work/feature-reports/*.json
            work/feature-reports/*.png
            work/feature-reports/*.csv
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Framoryx-Windows-Engine-Diagnostics
          path: |
            dist/Framoryx-Windows-x64.zip
            dist/Framoryx-Windows-x64.zip.sha256
          retention-days: 7
