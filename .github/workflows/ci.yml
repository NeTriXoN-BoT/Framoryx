name: Build and core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-core:
    name: Portable core / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/core --parallel
      - run: ctest --test-dir build/core --output-on-failure
  windows:
    name: Windows native build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/build/toolchain
            tools/PresentMon.exe
            tools/PresentMon-2.6.0-x64.exe
          key: llvm-mingw-20261104-ucrt-windows-x64
      - name: Fetch verified toolchain and monitor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-ci-tools.ps1
      - name: Build a clean portable package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Framoryx-Windows-x64
          path: |
            dist/Framoryx-Windows-x64.zip
            dist/Framoryx-Windows-x64.zip.sha256
          retention-days: 7
