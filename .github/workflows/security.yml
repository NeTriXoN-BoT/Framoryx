name: CodeQL security analysis
on:
  push:
    branches: [main]
    paths: ['source/**', 'desktop/**', 'runtime/**', 'scripts/**', '.github/workflows/security.yml']
  pull_request:
    paths: ['source/**', 'desktop/**', 'runtime/**', 'scripts/**', '.github/workflows/security.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  native-cpp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/build/toolchain
            tools/PresentMon.exe
            tools/PresentMon-2.6.0-x64.exe
          key: llvm-mingw-20261104-ucrt-windows-x64
      - name: Fetch verified compiler and monitoring dependency
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-ci-tools.ps1
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Analyze the actual Windows app, hooks, broker and helpers
        shell: pwsh
        run: ./source/build.ps1
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: /language:cpp/native-windows
  shared-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: linux_gcc_64
          - os: windows-latest
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxcb-present-dev libpulse-dev libxkbcommon-x11-0 libxcb-cursor0
          sudo apt-get install -y meson ninja-build python3-mako libvulkan-dev libdrm-dev libx11-dev libwayland-dev wayland-protocols libxkbcommon-dev libsystemd-dev libdbus-1-dev libcap-dev libegl1-mesa-dev glslang-tools libyaml-cpp-dev libgbm-dev
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          modules: qtmultimedia
          cache: true
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Analyze the shared UI and platform integrations
        shell: pwsh
        run: |
          cmake -S . -B build/desktop-security -DFRAMORYX_BUILD_DESKTOP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/desktop-security --config Release --parallel 3
      - name: Analyze the actual Linux game runtime
        if: runner.os == 'Linux'
        run: |
          export PATH="/usr/bin:$PATH"
          bash scripts/build-mangohud.sh work/security-runtime
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          category: /language:cpp/shared-desktop-${{ runner.os }}
