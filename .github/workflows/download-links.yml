name: Public download links
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-download:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify latest download without authentication
        run: python3 scripts/check-downloads.py --repository "$GITHUB_REPOSITORY" --all-assets
